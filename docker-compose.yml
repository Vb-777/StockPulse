# Local stack: PostgreSQL, Redis, one API instance (HTTP + outbox relay) and two worker replicas.
#   docker compose up --build
#   curl localhost:8080/health
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sp
      POSTGRES_PASSWORD: sp
      POSTGRES_DB: stockpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sp -d stockpulse"]
      interval: 2s
      retries: 30
    ports: ["5432:5432"]

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
    ports: ["6379:6379"]

  api:
    build: .
    environment: &env
      MODE: api
      DB_URL: jdbc:postgresql://postgres:5432/stockpulse
      DB_USER: sp
      DB_PASSWORD: sp
      REDIS_HOST: redis
      ADMIN_TOKEN: change-me
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8080:8080"]

  worker:
    build: .
    environment:
      <<: *env
      MODE: worker
      WORKER_THREADS: "8"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      replicas: 2
